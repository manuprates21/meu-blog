<!DOCTYPE html>

<html lang="PT-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeutyBlog</title>
<style>
    header{
        background-color: #81003F;
        color: #FFFFFF;
        text-align: center;
    }
    main{
        background-color:#FFFFFF ;
        color: #81003F;
        display: flex;
    }
    img{
        width: 80px;
        height: 80px;
    }
    .artigo-autor{
        font-weight: bold;
    }
</style>
</head>
<body>
    <header>
        <h1>blog sobre beleza feminina!</h1>
        <p>Aqui compartilhamos o mundo da mulher!</p>
    </header>
    <main>
        <img src="imagem-blog.png" alt="logo tipo da marca beautyblog">
        <div>
            <h1>seja bem-vinda</h1>
            <p class="artigo-autor"></p>Por: Manoela Prates</p>
            <p>Nessa pagina iremos falar sobre beleza feminina, modos de cuidar da pele, do corpo, modos de se vestir e muitas coisas sobre o mundo da mulher! Aproveite cada postagem.</p>
            <button>❤️<span>0</span></button>
        </div>
    </main>

</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(
        function(botao){
            botao.addEventListener("click", botaoClicado);
            function botaoClicado(){
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
           }
        })
</script>
</html>
